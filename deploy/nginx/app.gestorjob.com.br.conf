# Nginx — app.gestorjob.com.br
# SPA (Vite dist) + API Laravel em /api via PHP-FPM
# Instalar: sudo cp deploy/nginx/app.gestorjob.com.br.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/app.gestorjob.com.br.conf /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d app.gestorjob.com.br

server {
    listen 80;
    listen [::]:80;
    server_name app.gestorjob.com.br;

    root /var/www/gestorjob/code/frontend/dist;
    index index.html;

    client_max_body_size 12M;

    # Let's Encrypt / ACME
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gestorjob/code/frontend/dist;
        default_type "text/plain";
        allow all;
    }

    # API Laravel — tudo /api* vai para public/index.php
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/gestorjob/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/gestorjob/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Health Laravel embutido (opcional)
    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/gestorjob/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/gestorjob/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
